<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Member 360 AI Data Platform architecture</title>
  <desc id="desc">End-to-end architecture from synthetic insurance sources through Delta medallion processing, identity resolution, serving projections, hybrid retrieval, APIs, and user applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef3fa"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10243e"/><stop offset="1" stop-color="#173b62"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#16304f" flood-opacity="0.13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#285b8f"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#138a62"/></marker>
    <style>
      .title{font:700 42px Inter,Arial,sans-serif;fill:#10243e;letter-spacing:.3px}.subtitle{font:400 19px Inter,Arial,sans-serif;fill:#55708f}.section{font:700 17px Inter,Arial,sans-serif;fill:#285b8f;letter-spacing:1.8px}.card-title{font:700 20px Inter,Arial,sans-serif;fill:#10243e}.body{font:400 15px Inter,Arial,sans-serif;fill:#49637f}.small{font:400 13px Inter,Arial,sans-serif;fill:#607895}.white-title{font:700 22px Inter,Arial,sans-serif;fill:#fff}.white-body{font:400 14px Inter,Arial,sans-serif;fill:#dcecff}.pill{font:700 12px Inter,Arial,sans-serif;letter-spacing:.7px}.num{font:700 18px Inter,Arial,sans-serif}.arrow{fill:none;stroke:#285b8f;stroke-width:3;marker-end:url(#arrow)}.arrow-green{fill:none;stroke:#138a62;stroke-width:3;marker-end:url(#arrow-green)}.dash{fill:none;stroke:#7289a4;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1050" fill="url(#bg)"/>
  <text x="800" y="62" text-anchor="middle" class="title">MEMBER 360 AI DATA PLATFORM</text>
  <text x="800" y="96" text-anchor="middle" class="subtitle">Trusted insurance data products with rebuildable operational and vector projections</text>

  <text x="72" y="153" class="section">01 · SOURCE RELEASE</text>
  <g filter="url(#shadow)">
    <rect x="60" y="176" width="250" height="222" rx="18" fill="#fff" stroke="#cddaea"/>
    <rect x="60" y="176" width="250" height="12" rx="6" fill="#2c78c4"/>
    <circle cx="102" cy="230" r="23" fill="#e7f1fc"/><text x="102" y="237" text-anchor="middle" class="num" fill="#2368ad">S</text>
    <text x="140" y="226" class="card-title">Payer domains</text>
    <text x="86" y="270" class="body">Members &amp; demographics</text><text x="86" y="300" class="body">Plans &amp; benefit design</text><text x="86" y="330" class="body">Coverage &amp; policies</text><text x="86" y="360" class="body">Claims &amp; responsibility</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="60" y="424" width="250" height="174" rx="18" fill="#fff" stroke="#cddaea"/>
    <rect x="60" y="424" width="250" height="12" rx="6" fill="#54a2dd"/>
    <text x="86" y="474" class="card-title">Release contract</text>
    <text x="86" y="508" class="body">Deterministic CSV files</text><text x="86" y="538" class="body">Checksums + record counts</text><text x="86" y="568" class="body">Duplicate ground truth</text>
  </g>

  <text x="380" y="153" class="section">02 · TRUSTED LAKEHOUSE</text>
  <g filter="url(#shadow)">
    <rect x="365" y="176" width="250" height="222" rx="18" fill="#fff" stroke="#bed4ed"/>
    <rect x="365" y="176" width="250" height="12" rx="6" fill="#b7772a"/>
    <circle cx="407" cy="230" r="23" fill="#fff1df"/><text x="407" y="237" text-anchor="middle" class="num" fill="#a96214">B</text>
    <text x="445" y="226" class="card-title">Bronze Delta</text>
    <text x="391" y="270" class="body">Source-aligned records</text><text x="391" y="300" class="body">Immutable ingestion metadata</text><text x="391" y="330" class="body">File + run lineage</text>
    <rect x="391" y="351" width="166" height="27" rx="13" fill="#fff1df"/><text x="474" y="369" text-anchor="middle" class="pill" fill="#9b5d18">RECONCILED</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="660" y="176" width="250" height="222" rx="18" fill="#fff" stroke="#bce3d3"/>
    <rect x="660" y="176" width="250" height="12" rx="6" fill="#1b9b70"/>
    <circle cx="702" cy="230" r="23" fill="#e4f7ef"/><text x="702" y="237" text-anchor="middle" class="num" fill="#138a62">S</text>
    <text x="740" y="226" class="card-title">Silver Delta</text>
    <text x="686" y="270" class="body">Typed and normalized</text><text x="686" y="300" class="body">Domain quality rules</text><text x="686" y="330" class="body">Safe rejection boundary</text>
    <rect x="686" y="351" width="166" height="27" rx="13" fill="#e4f7ef"/><text x="769" y="369" text-anchor="middle" class="pill" fill="#137654">CONFORMED</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="955" y="176" width="250" height="222" rx="18" fill="#fff" stroke="#d6c8ef"/>
    <rect x="955" y="176" width="250" height="12" rx="6" fill="#7757ba"/>
    <circle cx="997" cy="230" r="23" fill="#f0eafb"/><text x="997" y="237" text-anchor="middle" class="num" fill="#6847ad">ID</text>
    <text x="1035" y="226" class="card-title">Identity resolution</text>
    <text x="981" y="270" class="body">Weighted evidence scoring</text><text x="981" y="300" class="body">Explainable match decisions</text><text x="981" y="330" class="body">Survivorship + source xref</text>
    <rect x="981" y="351" width="166" height="27" rx="13" fill="#f0eafb"/><text x="1064" y="369" text-anchor="middle" class="pill" fill="#6847ad">EVALUATED</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1250" y="176" width="290" height="222" rx="18" fill="url(#navy)"/>
    <rect x="1250" y="176" width="290" height="12" rx="6" fill="#e0ad40"/>
    <circle cx="1292" cy="230" r="23" fill="#f6d988"/><text x="1292" y="237" text-anchor="middle" class="num" fill="#70500b">G</text>
    <text x="1330" y="226" class="white-title">Gold Delta</text>
    <text x="1276" y="270" class="white-body">Canonical member + plan dimensions</text><text x="1276" y="300" class="white-body">Coverage and claim facts</text><text x="1276" y="330" class="white-body">Member 360 + match lineage</text>
    <rect x="1276" y="351" width="196" height="27" rx="13" fill="#294e75"/><text x="1374" y="369" text-anchor="middle" class="pill" fill="#fff">ANALYTICAL RECORD</text>
  </g>
  <path d="M310 287H353" class="arrow"/><path d="M615 287H648" class="arrow"/><path d="M910 287H943" class="arrow"/><path d="M1205 287H1238" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="660" y="440" width="250" height="130" rx="18" fill="#fff7ed" stroke="#e7b66e"/>
    <text x="686" y="483" class="card-title" fill="#925615">Quality quarantine</text>
    <text x="686" y="517" class="body">Rule ID · record key · reason</text><text x="686" y="545" class="small">Rejected before Silver admission</text>
  </g>
  <path d="M785 398V428" class="dash"/>
  <g filter="url(#shadow)">
    <rect x="955" y="440" width="250" height="130" rx="18" fill="#fff" stroke="#cddaea"/>
    <text x="981" y="483" class="card-title">Audit &amp; evaluation</text>
    <text x="981" y="517" class="body">Run manifests + counts</text><text x="981" y="545" class="small">Precision · recall · replay state</text>
  </g>
  <path d="M1080 398V428" class="dash"/>

  <text x="72" y="666" class="section">03 · REBUILDABLE PROJECTIONS &amp; ACCESS</text>
  <path d="M1395 398V633H340V692" class="arrow-green"/>
  <path d="M720 633V692" class="arrow-green"/>
  <g filter="url(#shadow)">
    <rect x="175" y="704" width="330" height="164" rx="18" fill="#fff" stroke="#bce3d3"/>
    <rect x="175" y="704" width="330" height="11" rx="6" fill="#1b9b70"/>
    <text x="205" y="757" class="card-title">PostgreSQL serving</text>
    <text x="205" y="792" class="body">Atomic Member 360 publication</text><text x="205" y="822" class="body">Gold run lineage + indexed queries</text><text x="205" y="850" class="small">Operational projection · rebuildable</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="554" y="704" width="330" height="164" rx="18" fill="#fff" stroke="#b8d6ef"/>
    <rect x="554" y="704" width="330" height="11" rx="6" fill="#2c78c4"/>
    <text x="584" y="757" class="card-title">OpenSearch hybrid index</text>
    <text x="584" y="792" class="body">BM25 lexical + k-NN vectors</text><text x="584" y="822" class="body">Reciprocal-rank fusion</text><text x="584" y="850" class="small">Ollama embeddings · rebuildable</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="933" y="704" width="290" height="164" rx="18" fill="url(#navy)"/>
    <text x="963" y="757" class="white-title">FastAPI trust boundary</text>
    <text x="963" y="792" class="white-body">Versioned member + assistant API</text><text x="963" y="822" class="white-body">Persona masking + metrics</text><text x="963" y="850" class="small" fill="#c9ddf2">Citations · abstention</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1272" y="704" width="250" height="164" rx="18" fill="#fff" stroke="#d6c8ef"/>
    <rect x="1272" y="704" width="250" height="11" rx="6" fill="#7757ba"/>
    <text x="1302" y="757" class="card-title">Experience layer</text>
    <text x="1302" y="792" class="body">Streamlit Member 360</text><text x="1302" y="822" class="body">Grounded assistant</text><text x="1302" y="850" class="small">Analyst and analytics personas</text>
  </g>
  <path d="M505 786V890H921V840" class="arrow-green"/><path d="M884 786H921" class="arrow"/><path d="M1223 786H1260" class="arrow"/>

  <rect x="60" y="925" width="1480" height="76" rx="18" fill="#10243e"/>
  <circle cx="101" cy="963" r="22" fill="#2c78c4"/><text x="101" y="970" text-anchor="middle" class="num" fill="#fff">i</text>
  <text x="140" y="957" class="white-title">Trust rule</text>
  <text x="140" y="982" class="white-body">Delta Gold owns canonical truth. PostgreSQL and OpenSearch are disposable projections that can always be rebuilt.</text>
  <rect x="1281" y="946" width="221" height="34" rx="17" fill="#294e75"/><text x="1391" y="968" text-anchor="middle" class="pill" fill="#fff">SYNTHETIC DATA ONLY</text>
</svg>
