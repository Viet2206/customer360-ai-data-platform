name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: customer360
          POSTGRES_USER: customer360
          POSTGRES_PASSWORD: customer360
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U customer360 -d customer360"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: make lint
      - run: PGPASSWORD=customer360 psql -h localhost -p 55432 -U customer360 -d customer360 -f infrastructure/docker/postgres/init.sql
      - run: make test-all
      - run: make compose-check
