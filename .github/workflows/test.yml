name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: customer360
          POSTGRES_USER: customer360
          POSTGRES_PASSWORD: customer360
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U customer360 -d customer360"
          --health-interval 5s --health-timeout 5s --health-retries 12
      opensearch:
        image: opensearchproject/opensearch:3.6.0
        env:
          discovery.type: single-node
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["59200:9200"]
        options: >-
          --health-cmd "curl --fail --silent http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups --python 3.11
      - run: make lint
      - run: PGPASSWORD=customer360 psql -h localhost -p 55432 -U customer360 -d customer360 -f infrastructure/docker/postgres/init.sql
      - run: make test-all
      - run: make index-search
      - run: make evaluate-search
      - run: make compose-check
