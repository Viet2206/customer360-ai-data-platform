name: customer360

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customer360}
      POSTGRES_USER: ${POSTGRES_USER:-customer360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customer360}
    ports:
      - "${CUSTOMER360_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  opensearch:
    profiles: ["ai"]
    image: opensearchproject/opensearch:3.6.0
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${CUSTOMER360_OPENSEARCH_PORT:-59200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.32.13
    ports:
      - "${CUSTOMER360_OLLAMA_PORT:-51434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  api:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: infrastructure/docker/app/Dockerfile
    environment:
      CUSTOMER360_DATABASE_URL: postgresql+psycopg://customer360:customer360@postgres:5432/customer360
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  streamlit:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: infrastructure/docker/app/Dockerfile
    command: ["uv", "run", "streamlit", "run", "apps/streamlit/app.py", "--server.address=0.0.0.0"]
    environment:
      CUSTOMER360_API_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./apps:/app/apps:ro
      - ./.streamlit:/app/.streamlit:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  opensearch_data:
  ollama_data:
